<title>Links | Camino Real Mexican Restaurants</title>

<style>
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:900;font-display:swap;src:url(/assets/fonts/playfairdisplay-900.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/fonts/sourcesans3-400.woff2) format('woff2')}
:root{
  --bg:#FBF6EB;--text:#20160f;--primary:#B4271E;--on-primary:#F7F1E6;
  --hi:#14110E;--on-hi:#F7F1E6;--muted:#7a6a5a;--card:#ffffff;--border:#ece0cc;
  --f-display:'Playfair Display',Georgia,serif;--f-body:'Source Sans 3',system-ui,sans-serif;--radius:20px;--pill:999px;
  --shadow-sm:0 2px 9px rgba(40,25,15,.10);--shadow:0 12px 32px rgba(40,25,15,.16);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f-body);color:var(--text);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(1100px 460px at 50% -8%,color-mix(in srgb,var(--hi) 22%,transparent) 0%,transparent 60%),
    radial-gradient(860px 400px at 50% 108%,color-mix(in srgb,var(--primary) 12%,transparent) 0%,transparent 60%),var(--bg);}
img{max-width:100%;display:block}
a{color:var(--primary);text-decoration:none}
h1{font-family:var(--f-display);line-height:1.05;margin:0;color:var(--text);letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:12px}
.wrap{width:100%;max-width:460px;padding:40px 20px 32px;text-align:center}
.logo{max-width:180px;height:auto;margin:0 auto 16px;filter:drop-shadow(var(--shadow))}
h1{font-size:clamp(1.6rem,6.4vw,2.05rem)}
.loc{display:inline-flex;align-items:center;gap:9px;margin:10px 0 0;font-family:var(--f-body);font-weight:700;
  font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--primary)}
.loc::before,.loc::after{content:"";width:18px;height:2px;border-radius:2px;background:var(--hi)}
.beads{height:14px;width:150px;margin:18px auto 26px;
  background-image:radial-gradient(circle,var(--primary) 42%,transparent 46%),radial-gradient(circle,var(--hi) 42%,transparent 46%);
  background-size:24px 14px,24px 14px;background-position:0 center,12px center;background-repeat:repeat-x;opacity:.92}
.socials{display:flex;justify-content:center;gap:14px;margin:0 0 24px}
.social{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:var(--pill);
  background:var(--card);color:var(--primary);box-shadow:var(--shadow-sm);border:1px solid var(--border);
  transition:transform .15s ease,background .15s ease,color .15s ease,border-color .15s ease}
.social:hover{transform:translateY(-3px);background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.social svg{width:23px;height:23px}
.links{display:flex;flex-direction:column;gap:13px}
.link{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--radius);
  font-family:var(--f-display);font-weight:700;font-size:1.06rem;box-shadow:var(--shadow-sm);
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
.link:hover{transform:translateY(-2px);box-shadow:var(--shadow);filter:brightness(1.03)}
.link .ic{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--pill);
  background:color-mix(in srgb,currentColor 15%,transparent)}
.link .ic svg{width:20px;height:20px}
.link .lbl{flex:1 1 auto;text-align:left}
.link .arw{flex:0 0 auto;opacity:.55}
.link .arw svg{width:18px;height:18px}
.link--pri{background:var(--primary);color:var(--on-primary)}
.link--hi{background:var(--hi);color:var(--on-hi)}
.foot{margin:30px 0 4px;font-size:.82rem;color:var(--muted)}
.foot a{color:var(--primary);font-weight:600}

.loc{cursor:default}
.links .link{background:var(--card);color:var(--text);border:1px solid var(--border);font-family:var(--f-body);font-weight:400;font-size:1rem;padding:15px 18px}
.links .link .lbl b{font-family:var(--f-display);font-weight:700;font-size:1.06rem;display:block;line-height:1.15}
.links .link .lbl small{display:block;font-family:var(--f-body);font-weight:500;font-size:.82rem;color:var(--muted);margin-top:1px}
.links .link .ic{width:38px;height:38px;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.links .link .arw{color:var(--primary);opacity:.5}
</style>
</head>
